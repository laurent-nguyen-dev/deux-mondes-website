<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{{ config.description }}">
  <link rel="stylesheet" href="{{ get_url(path='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a href="{{ get_url(path='/') }}" class="logo">{{ config.title }}</a>
    <nav>
      <a href="{{ get_url(path='/') }}">Présentation</a>
      <a href="{{ get_url(path='concerts') }}">Concerts</a>
      <a href="{{ get_url(path='galerie') }}">Galerie</a>
      <a href="{{ get_url(path='contact') }}">Contact</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock content %}
  </main>

  <footer class="site-footer">
    <p>© {{ now() | date(format="%Y") }} {{ config.title }}</p>
  </footer>
</body>
</html>
